services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    container_name: ollama-server

  pull-qwen:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: /bin/bash
    command:
      - -c
      - |
        sleep 5
        ollama pull qwen2.5:0.5b
    environment:
      - OLLAMA_HOST=http://ollama:11434
    container_name: qwen-puller

volumes:
  ollama_data:
